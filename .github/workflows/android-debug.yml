name: Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle -p android-native assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: patienten-app-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
